<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {

	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

	}

.leaflet-container .leaflet-overlay-pane svg {

	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;

	}

.leaflet-container img.leaflet-tile {

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {

	}

.leaflet-interactive {

.leaflet-grab {

	}

.leaflet-popup-pane,

	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */

	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;

	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;

	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {

	}
.leaflet-bar a:last-child {

	border-bottom-right-radius: 4px;

	}
.leaflet-bar a.leaflet-disabled {

	}

.leaflet-touch .leaflet-bar a {

.leaflet-touch .leaflet-bar a:first-child {

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {

	}
.leaflet-control-layers-toggle {

.leaflet-control-layers-separator {

/* Default icon URLs */

	background-image: url(images/marker-icon.png);

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-control-attribution,

.leaflet-left .leaflet-control-scale {

.leaflet-control-scale-line {

.leaflet-control-scale-line:not(:first-child) {

.leaflet-touch .leaflet-control-attribution,

.leaflet-touch .leaflet-bar {

.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;

	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;
	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;
	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;
	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,

/* div icon */

.leaflet-div-icon {
	background: #fff;

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

	pointer-events: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {

	margin-right: -12px;

	}
.leaflet-tooltip-right:before {
	left: 0;
	margin-left: -12px;
	border-right-color: #fff;

@media print {

<style>
:root{
  --page:#E7EDF5;--ink:#1D2B44;--navy:#0A2A5E;--or:#F07016;--blue:#2F6FBF;--line:#D6DFEC;--mut:#6B7891;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0B1322}}
:root[data-theme="dark"]{--page:#0B1322}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page);color:var(--ink);overflow:hidden;
  display:flex;flex-direction:column;
  font-family:'Barlow Semi Condensed','Arial Narrow',Arial,Helvetica,sans-serif}
button{font-family:inherit}
#modebar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--navy,#0B2A5B);border-bottom:1px solid rgba(255,255,255,.15)}
.mb-lbl{font-size:11px;font-weight:600;color:#DCE7F7}
.mb-btn{padding:3px 10px;font-size:11px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);border-radius:6px;cursor:pointer}
.mb-btn.on{background:#fff;color:var(--navy,#0B2A5B);border-color:#fff}
#vp{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}

#hdr{position:sticky;top:0;left:0;width:1264px;height:162px;z-index:900;background-position:0 0}
#body{position:relative;width:1264px;height:544px;overflow:hidden;background-position:0 -162px}

/* header */
#emblem{position:absolute;left:14px;top:12px;width:66px;height:48px;border-radius:9px;background:#fff;padding:3px;object-fit:contain}
#title{position:absolute;left:92px;top:12px;font-size:27px;line-height:42px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.2px}
#score{position:absolute;left:760px;top:10px;width:238px;height:50px;border:1px solid rgba(255,255,255,.45);border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;padding:0 10px;color:#fff}
#score .num{font-size:36px;font-weight:700;line-height:1;color:#FFB570}
#score .lbl{font-size:12px;line-height:13px;font-weight:600}
#score .sub{font-size:10px;font-weight:400;color:#C9D8F0;margin-top:2px}
#tabs{position:absolute;z-index:10;left:14px;top:66px;width:262px}
.tab{display:block;width:100%;height:26px;margin:0 0 4px;padding:0 10px;text-align:left;font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.4);border-radius:6px;cursor:pointer}
.tab:hover{background:rgba(255,255,255,.16)}
.tab.on{background:#fff;color:var(--navy);border-color:#fff;border-left:5px solid var(--or)}
.tab:focus-visible,.fbtn:focus-visible,.pill:focus-visible,.pager button:focus-visible,.reset:focus-visible{outline:2px solid #FFB570;outline-offset:1px}
#filters{position:absolute;z-index:10;left:300px;top:62px;width:700px;height:90px;display:grid;grid-template-columns:repeat(5,132px);grid-auto-rows:30px;gap:8px 7px;align-content:start}
.fbtn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:4px;height:30px;padding:0 8px;font-size:11px;font-weight:600;color:var(--navy);background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:6px;cursor:pointer}
.fbtn .fl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn .fc{font-size:8.5px;font-weight:700;color:#fff;background:var(--or);border-radius:8px;padding:1px 5px;line-height:11px}
.fbtn .fc[hidden]{display:none}
.fbtn.act{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}
.fbtn.open{background:#FFF1E4}
.reset{position:absolute;right:0;top:76px;padding:0;background:none;border:0;color:#DCE7F7;font-size:10.5px;text-decoration:underline;cursor:pointer}
.reset:hover{color:#fff}

/* dropdown */
.dd{position:absolute;z-index:60;width:400px;display:flex;gap:10px;padding:10px;background:#fff;border:1px solid #C3CFE0;border-radius:8px;box-shadow:0 10px 28px rgba(4,32,79,.32)}
.dd[hidden]{display:none}
.dd-l{flex:1;min-width:0}
.dd-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:11.5px;color:var(--navy)}
.dd-h span a{font-size:10px;color:var(--blue);margin-left:8px;cursor:pointer;text-decoration:underline}
.dd-list{max-height:220px;overflow:auto;border-top:1px solid #E1E7F0}
.opt{display:flex;align-items:center;gap:6px;height:22px;font-size:11.5px;cursor:pointer}
.opt input{margin:0;width:13px;height:13px;accent-color:var(--or)}
.opt .sw{width:9px;height:9px;border-radius:50%;flex:none}
.opt .ol{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .on{font-size:10px;color:var(--mut);flex:none}
.dd-r{width:190px;text-align:center;flex:none}
.dd-r .cap{font-size:9px;color:var(--mut);margin-top:2px}

/* panel */
.page{position:absolute;inset:0;pointer-events:none}
.panel{position:absolute;pointer-events:auto;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.panel svg{display:block}
.pt{font-size:12px;font-weight:600;color:var(--navy)}
.mhead{height:50px;padding:5px 8px 0;background:#fff;position:relative;z-index:2}
.pills{display:flex;gap:3px;margin-top:3px}
.pill{padding:1px 6px;font-size:8.5px;font-weight:600;color:#34435C;background:#fff;border:1px solid #C3CFE0;border-radius:9px;cursor:pointer}
.p1mnav{display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line);background:#F7F9FC}
.p1mnav-btn{width:20px;height:20px;flex:0 0 auto;border:1px solid #C3CFE0;background:#fff;border-radius:5px;color:var(--navy);font-size:13px;line-height:1;cursor:pointer;padding:0}
.p1mnav-btn:hover{background:#EEF2F8}
.p1mnav-title{flex:1;font-size:11.5px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p1mnav-sub{font-weight:400;color:var(--mut);font-size:9.5px;margin-left:4px}
.p1mdots{display:flex;gap:5px}
.p1mdot{width:6px;height:6px;border-radius:50%;background:#C9D1DE;cursor:pointer;display:inline-block}
.p1mdot.on{background:var(--or)}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mlegend{display:flex;gap:6px;padding:3px 8px 0;font-size:8.5px;line-height:11px;color:#34435C;overflow:hidden;background:#fff;position:relative;z-index:2}
.mlegend .mk{flex:none}
.mapbase{position:absolute;inset:0;background:#EEF2F8;z-index:1}
.mapbase.bm-light .leaflet-tile-pane{filter:saturate(.95) brightness(1.02)}
.mapbase.bm-terrain .leaflet-tile-pane{filter:saturate(.55) brightness(1.05) hue-rotate(-6deg)}
.maptint{position:absolute;inset:0;z-index:250;pointer-events:none;background:var(--blue);opacity:.04}
.mapbase.bm-terrain .maptint{opacity:.07}
.mapstatus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:260;font-size:10px;color:var(--mut);background:rgba(255,255,255,.9);padding:4px 10px;border-radius:5px;pointer-events:none;white-space:nowrap;box-shadow:0 1px 4px rgba(4,32,79,.12)}
.mapstatus.err{color:#B23A3A}
.mapov{position:absolute;inset:0;z-index:3}
.mapov svg{display:block}
.leaflet-control-attribution{font-size:7px;padding:0 3px;background:rgba(255,255,255,.75)}
.leaflet-bar,.leaflet-control{box-shadow:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 0 5px}

/* analisis */
.ana{padding:4px 12px 0}
.ah{display:flex;align-items:center;gap:8px;height:17px;margin-bottom:2px}
.chip{font-size:9px;font-weight:600;color:#B4530A;background:#FFF1E4;border-radius:8px;padding:0 7px;line-height:14px}
.ana ul{margin:0;padding:0;list-style:none;columns:3;column-gap:18px;column-fill:auto;height:85px;font-size:9.8px;line-height:12px;overflow:hidden}
.ana li{break-inside:avoid;position:relative;margin:0 0 3px;padding-left:9px}
.ana li::before{content:"";position:absolute;left:0;top:4px;width:4px;height:4px;border-radius:50%;background:var(--or)}
.ana b{color:var(--navy)}

/* tabel dokumentasi */
.dt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:10.5px}
.dt th{height:24px;padding:0 8px;text-align:left;font-size:11px;font-weight:600;color:#fff;background:var(--navy)}
.dt td{height:160px;padding:6px 8px;vertical-align:top;line-height:1.3;border-bottom:1px solid #E4EAF3}
.dt tr:nth-child(even) td{background:#F8FAFD}
.dt td.pc{padding:6px 8px}
.dt tr.emp td{height:auto;padding:70px 20px;text-align:center;color:#7A879C;font-size:12px}
.mut{color:var(--mut);font-size:9.5px;margin-top:3px}
.pr{display:flex;align-items:center;gap:6px;height:72px;margin-bottom:4px}
.pr:last-child{margin-bottom:0}
.tag{flex:none;width:46px;padding:2px 0;text-align:center;font-size:9px;font-weight:700;color:#fff;border-radius:3px}
.tag.c{background:var(--or)}
.tag.f{background:var(--blue)}
.ph{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-width:0;height:72px;overflow:hidden;background:#EEF2F8;border:1px dashed #B9C5D8;border-radius:4px;text-decoration:none;cursor:zoom-in}
.ph .phi{font-size:9px;line-height:11px;text-align:center;color:#7A879C}
.ph.none{border-style:solid;border-color:#E1E7F0;cursor:default}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.ph img.ok{opacity:1}
a.ph:hover{border-color:var(--or)}
.pm{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(10,26,58,.66)}
.pm[hidden]{display:none}
.pm-box{width:820px;max-width:92%;background:#fff;border-radius:10px;padding:14px 16px 16px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.pm-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.pm-h b{font-size:14px;color:var(--navy)}
.pm-h .mut{flex:1;color:var(--mut);font-size:11px}
.pm-x{flex:none;width:26px;height:26px;padding:0;border:none;background:#EEF2F8;border-radius:5px;cursor:pointer;font-size:13px;color:var(--navy)}
.pm-x:hover{background:#E1E7F0}
.pm-imgs{display:flex;gap:14px}
.pm-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.pm-col .tag{width:74px;flex:none}
.pm-img{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:300px;overflow:hidden;background:#EEF2F8;border:1px solid #E1E7F0;border-radius:6px}
.pm-img img{width:100%;height:100%;object-fit:cover}
.pm-img.none{color:#7A879C;font-size:11px}
.pm-link{font-size:10.5px;color:var(--blue);text-decoration:underline}
.pager{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:10.5px;background:#F8FAFD;border-top:1px solid #E1E7F0}
.pager button{padding:2px 9px;font-size:10.5px;font-weight:600;color:var(--navy);background:#fff;border:1px solid #C3CFE0;border-radius:5px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.pager label{display:flex;align-items:center;gap:5px;cursor:pointer}
.pager input{margin:0;accent-color:var(--or)}
.pg{display:flex;align-items:center;gap:8px}

#foot{position:absolute;left:14px;top:673px;font-size:10px;color:#7A5C3A}
#tip{position:absolute;display:none;z-index:950;max-width:270px;padding:5px 8px;font-size:10.5px;line-height:1.35;color:#fff;background:var(--navy);border-radius:5px;pointer-events:none}
</style>

const verdict = (v, up = 'unggul atas FP', eq = 'setara FP', dn = 'di bawah FP') => v == null ? '' : (v >= 0.3 ? up : v <= -0.3 ? dn : eq);

function worstGroup(recs, p, keyf, t) {
  const m = new Map();
  pairsOf(recs, p, t).forEach(r => { const k = keyf(r) || NA; if (!m.has(k)) m.set(k, []); m.get(k).push(wlOf(r, p, t)); });
  return [...m.entries()].filter(([, a]) => a.length >= 2).map(([k, a]) => ({ k, n: a.length, v: mean(a) })).sort((a, b) => a.v - b.v);
}
const NEG = /tidak|tanpa|aman|belum|subur|segar|bagus|bersih/i;
const CROPW = /tanaman|jagung|toks|toxic|stagnan|kantrak|pendek|tumbuh/i;
const cut = (t, n) => t.length > n ? t.slice(0, n - 3).trim() + '...' : t;
function cropComment(recs) {
  const c = recs.filter(r => (wlAvg(r, 'crop') || 0) < 0).sort((a, b) => wlAvg(a, 'crop') - wlAvg(b, 'crop'));
  for (const r of c) {
    const cm = [r.komentar21, r.alasan.h21, r.alasan.h14].find(x => x && CROPW.test(x) && !NEG.test(x));
    if (cm) return { id: r.id, t: cut(cm, 78) };

}
function goodComment(recs) {
  const sc = r => sum(['umum', 'khusus'].map(p => wlAvg(r, p) || 0));
  const c = recs.filter(r => r.pref.h21 === 'cap' && r.alasan.h21 && r.alasan.h21.length <= 70).sort((a, b) => sc(b) - sc(a));
  return c.length ? { id: c[0].id, t: c[0].alasan.h21 } : null;
}
function analysis1(recs) {

  o.push(`<b>Cakupan.</b> ${n} dari ${DATA.length} demo di ${kabs} kabupaten; pembanding terbanyak ${esc(tf[0])} (${tf[1]}), varietas ${esc(tv[0])} (${tv[1]}).${n < 5 ? ' Demo sedikit, baca sebagai gambaran awal.' : ''}`);
  ['umum', 'khusus'].forEach(p => {
    const st = trio(p, recs), lt = lastT(recs, p);
    if (lt < 0) { o.push(`<b>${PLABEL[p]}.</b> Belum ada skor pada demo terpilih.`); return; }
    const all = mean(st.filter(x => x.n).map(x => x.wl)), l = st[lt];
    let extra = '';
    if (p === 'khusus') {
      const key = ['h7', 'h14', 'h21'][lt], bt = recs.filter(r => r.better[key]);

    }

  });

  if (ltc >= 0) {
    const l = stc[ltc], allc = mean(stc.filter(x => x.n).map(x => x.wl));
    const wv = worstGroup(recs, 'crop', r => r.var, ltc)[0];
    const w = (allc < 0 && wv && wv.v < 0) ? ` Terendah: varietas ${esc(wv.k)} (${fmt(wv.v, 2, true)}, n=${wv.n}).` : '';
    o.push(`<b>Crop performa.</b> Capreno ${verdict(allc, 'di atas FP', 'setara FP', 'di bawah FP')}: skor ${fmt(l.cap)} vs ${fmt(l.fp)} (${T[ltc]}), kalah di ${l.lose} dari ${l.n} demo.${w}`);
  }
  const pc = prefCounts(recs).filter(x => x.label !== '40-45 HST*' && x.cap + x.fp > 0), sc = susCounts(recs), nf = sc.fp.Iya + sc.fp.Tidak, nc = sc.cap.Iya + sc.cap.Tidak;
  if (pc.length || nf || nc) o.push(`<b>Plot disukai.</b> ${pc.length ? 'Capreno dipilih di ' + pc.map(x => `${x.cap}/${x.cap + x.fp} (${x.label})`).join(', ') + '.' : ''}${(nf || nc) ? ` Susulan 60 HST: FP ${sc.fp.Iya}/${nf}, Capreno ${sc.cap.Iya}/${nc} petani.` : ''}`);
  const cc = cropComment(recs), gc = goodComment(recs), cm = [];
  if (gc) cm.push(`\u201C${esc(gc.t)}\u201D (${esc(gc.id)}, pilih Capreno)`);
  if (cc) cm.push(`\u201C${esc(cc.t)}\u201D (${esc(cc.id)}, soal tanaman)`);
  if (cm.length) o.push(`<b>Komentar.</b> ${cm.join('; ')}.`);
  return o;
}
function analysis2(recs) {

  const pos = all.filter(x => x.st.wl > 0).length, neg = all.filter(x => x.st.wl < 0).length;
  o.push(`<b>Ringkasan.</b> Dari ${all.length} metrik, WL rata-rata positif di ${pos}, negatif di ${neg}, imbang di ${all.length - pos - neg} (${n} demo).${n < 5 ? ' Demo sedikit, baca hati-hati.' : ''}`);

    o.push(`<b>Crop performa.</b> WL ${stc.map(x => x.n ? fmt(x.wl, 2, true) : '\u2013').join(' / ')}. Capreno kalah di ${l.lose} dari ${l.n} demo (${T[ltc]})${lose.length ? ', terutama ' + lose.join(', ') : ''}.`);
  }

function pieSVG(opts, total, size) {
  const r = size / 2 - 3, cx = size / 2, cy = size / 2;
  let a0 = -Math.PI / 2, out = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" font-family="inherit">`;
  if (opts.length === 1) out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PIE[0]}"/><text x="${cx}" y="${cy + 4}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">100%</text>`;
  else opts.forEach((o, i) => {
    const fr = o.n / total, a1 = a0 + fr * 2 * Math.PI, lg = fr > 0.5 ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    out += `<path d="M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${lg} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${PIE[i % PIE.length]}" stroke="#fff" stroke-width="1.2" data-tip="${esc(`${o.v}\n${o.n} demo (${Math.round(fr * 100)}%)`)}"/>`;
    if (fr >= 0.08) { const am = (a0 + a1) / 2; out += `<text x="${(cx + r * 0.62 * Math.cos(am)).toFixed(1)}" y="${(cy + r * 0.62 * Math.sin(am) + 3).toFixed(1)}" font-size="9" font-weight="700" fill="#fff" text-anchor="middle" pointer-events="none">${Math.round(fr * 100)}%</text>`; }
    a0 = a1;
  });
  return out + '</svg>';
}

  updateFilterBtns();
}
function closeDD() { S.dd = null; const dd = $('dd'); dd.hidden = true; updateFilterBtns(); }

/* ============ render ============ */
function renderMaps() {
  if (S.page === 1) updateMapPanel('p1map', 270, 380, 50);
  if (S.page === 2) updateMapPanel('p2map', 322, 380, 34);
}
function render() {
  const recs = filtered();
  $('scoreN').textContent = DATA.length;
  $('scoreSub').textContent = recs.length === DATA.length ? 'Semua demo tampil' : `Terpilih filter: ${recs.length} demo`;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', +t.dataset.p === S.page));
  ['p1', 'p2', 'p3'].forEach(id => { $(id).style.display = id === 'p' + S.page ? 'block' : 'none'; });
  updateFilterBtns();
  if (S.page === 1) {
    $('p1m').innerHTML = matrixPanelHTML(recs, 712, 380);
    $('p1pref').innerHTML = prefSVG(recs, 254, 212);
    $('p1sus').innerHTML = susSVG(recs, 254, 162);
    $('p1ana').innerHTML = anaHTML('Analisis data', analysis1(recs), recs.length);
  } else if (S.page === 2) {
    $('p2wl').innerHTML = wlPanelHTML(recs, 552, 380);
    $('p2heat').innerHTML = heatSVG(recs, 362, 380);
    $('p2ana').innerHTML = anaHTML('Analisis data', analysis2(recs), recs.length);
  } else {
    const r = p3HTML(recs);
    $('p3t').innerHTML = r.html;
    $('p3ana').innerHTML = anaHTML('Analisis data', analysis3(recs, r.visible, r.list), recs.length);
  }
  try { renderMaps(); } catch (err) { console.error('Gagal render peta:', err); }
}

/* ============ init & events ============ */
function fit() {
  const vp = $('vp'), st = $('stage');
  const w = vp.clientWidth, h = vp.clientHeight;
  const k = S.view === 'mobile' ? 1 : Math.min(w / 1264, h / 706);
  st.style.zoom = k;
  S.k = k;
  Object.keys(LMAPS).forEach(id => { if (LMAPS[id]) LMAPS[id].invalidateSize(false); });
}
function applyView() {
  document.body.classList.toggle('mode-mobile', S.view === 'mobile');
  $('vp').classList.toggle('scrollmode', S.view === 'mobile');
  document.querySelectorAll('#modebar [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  try { localStorage.setItem('capreno_view', S.view); } catch (e) { }
  fit();
}
function init() {
  const st = $('stage'), tip = $('tip');
  // foto: tampil hanya jika berhasil dimuat; jika diblokir/gagal, placeholder tetap ada
  st.addEventListener('load', e => { if (e.target.tagName === 'IMG' && e.target.closest('.ph')) e.target.classList.add('ok'); }, true);
  st.addEventListener('error', e => { if (e.target.tagName === 'IMG' && e.target.closest('.ph')) e.target.remove(); }, true);
  window.addEventListener('resize', fit);
  $('modebar').addEventListener('click', e => {
    const b = e.target.closest('[data-view]');
    if (b) { S.view = b.dataset.view; applyView(); }
  });
  st.addEventListener('mousemove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.style.display = 'none'; return; }
    tip.innerHTML = esc(el.getAttribute('data-tip')).replace(/\n/g, '<br>'); tip.style.display = 'block';
    const r = st.getBoundingClientRect(), k = S.k || 1;
    let x = (e.clientX - r.left) / k + 12, y = (e.clientY - r.top) / k + 12;
    if (x + tip.offsetWidth > 1258) x -= tip.offsetWidth + 24;
    if (y + tip.offsetHeight > 660) y -= tip.offsetHeight + 24;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  st.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  st.addEventListener('click', e => {
    const t = e.target;
    const ph = t.closest('.ph[data-rid]'); if (ph) { e.preventDefault(); openPM(ph.dataset.rid, ph.dataset.h); return; }
    if (t.closest('.pm-x')) { closePM(); return; }
    if (t.id === 'pm') { closePM(); return; }
    const tab = t.closest('.tab'); if (tab) { S.page = +tab.dataset.p; closeDD(); render(); return; }
    const fb = t.closest('.fbtn'); if (fb) { openDD(fb.dataset.k); return; }
    if (t.closest('#reset')) { FILTERS.forEach(f => { S.sel[f.k] = new Set(f.opts.map(o => o.v)); }); S.p3 = 0; if (S.dd) { const f = FILTERS.find(x => x.k === S.dd); $('dd').innerHTML = ddHTML(f); } render(); return; }
    const bm = t.closest('[data-bm]'); if (bm) { S.basemap = bm.dataset.bm; Object.keys(LMAPS).forEach(k => setBasemapLayer(LMAPS[k], S.basemap)); renderMaps(); return; }
    const pill = t.closest('.pill'); if (pill) { S.mapT = pill.dataset.map; renderMaps(); return; }
    const p1mBtn = t.closest('[data-p1m]'); if (p1mBtn) { S.p1m = (S.p1m + (+p1mBtn.dataset.p1m) + MATRIX_VIEWS.length) % MATRIX_VIEWS.length; render(); return; }
    const p1mDot = t.closest('[data-p1mgo]'); if (p1mDot) { S.p1m = +p1mDot.dataset.p1mgo; render(); return; }
    const p2wlBtn = t.closest('[data-p2wl]'); if (p2wlBtn) { S.p2wl = (S.p2wl + (+p2wlBtn.dataset.p2wl) + MATRIX_VIEWS.length) % MATRIX_VIEWS.length; render(); return; }
    const p2wlDot = t.closest('[data-p2wlgo]'); if (p2wlDot) { S.p2wl = +p2wlDot.dataset.p2wlgo; render(); return; }
    const pg = t.closest('[data-pg]'); if (pg && !pg.disabled) { S.p3 += +pg.dataset.pg; render(); return; }
    const a = t.closest('.dd [data-a]');
    if (a) { const f = FILTERS.find(x => x.k === S.dd); S.sel[f.k] = a.dataset.a === 'all' ? new Set(f.opts.map(o => o.v)) : new Set(); $('dd').querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = a.dataset.a === 'all'; }); S.p3 = 0; render(); return; }
    if (!t.closest('#dd')) closeDD();
  });
  st.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'onlyFull') { S.onlyFull = t.checked; S.p3 = 0; render(); return; }
    if (t.closest && t.closest('#dd') && t.dataset.i != null) {
      const f = FILTERS.find(x => x.k === S.dd), v = f.opts[+t.dataset.i].v;
      if (t.checked) S.sel[f.k].add(v); else S.sel[f.k].delete(v);
      S.p3 = 0; render();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDD(); closePM(); } });
  // semua event listener sudah terpasang di atas -- baru render pertama kali di sini,
  // dibungkus try/catch supaya error tak terduga (mis. dari basemap peta) tidak pernah
  // sampai membatalkan pemasangan listener klik/filter di atas.
  try { buildFilters(); applyView(); render(); }
  catch (err) { console.error('Gagal render awal:', err); try { buildFilters(); applyView(); } catch (e2) { console.error(e2); } }
}
if (typeof document !== 'undefined' && document.getElementById('stage')) init();

</script>
</body>
